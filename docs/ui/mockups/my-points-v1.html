<style>

.scroll{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;scrollbar-width:none}.scroll::-webkit-scrollbar,.photos::-webkit-scrollbar{display:none}.form{padding:8px 16px 24px;display:flex;flex-direction:column;gap:12px}.field{position:relative;border:1px solid #82746d;border-radius:4px;padding:16px;min-height:74px;overflow-wrap:break-word;background:transparent}.field label{display:block;font-size:20.4px;line-height:26px;color:#66574f;margin-bottom:6px}.field.placeholder{color:#76675f;padding-top:20px}.field.area{min-height:142px}.field.error{border:2px solid #ba1a1a}.field.error label{color:#ba1a1a}.hint{color:#ba1a1a;font-size:20.4px;line-height:27px;margin-top:-7px}.section{font-size:27.2px;line-height:34px;font-weight:500;margin:4px 0 0}.coords{font-size:23.8px;line-height:31px;overflow-wrap:normal;font-variant-numeric:tabular-nums}.button{display:block;width:100%;border:1px solid #8b4f2b;border-radius:100px;background:transparent;color:#8b4f2b;padding:10px 18px;min-height:48px;font-size:23.8px;line-height:30px;text-align:center;text-decoration:none}.primary{background:#8b4f2b;color:white;border-color:#8b4f2b}.stack{display:flex;flex-direction:column;gap:8px}.divider{border:0;border-top:1px solid #d4c4bb;margin:6px 0}.photos{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:none;padding:0 0 4px}.photo{width:112px;height:112px;flex:none;border-radius:12px;position:relative;overflow:hidden;background-image:url('objects-ui-approved-v1.png');background-size:819.2px 546.14px;background-position:-292px -120px}.photo.alt{background-position:-403px -120px}.photo.third{background-position:-300px -242px}.remove{position:absolute;right:0;top:0;width:48px;height:48px;border:0;background:transparent;display:grid;place-items:center;padding:0}.remove span{width:32px;height:32px;border-radius:50%;background:#000b;color:white;font-size:28px;line-height:31px;text-align:center}.photo.selected{outline:2px solid #8b4f2b;outline-offset:-2px}.hero{width:100%;aspect-ratio:1.8;background-image:url('objects-ui-approved-v1.png');background-size:1066px 711px;background-position:-733px -92px;border-radius:12px;min-height:160px;border:0}.card{border-radius:12px;background:#f6e7df;padding:12px;display:flex;flex-direction:column;gap:12px}.note{font-size:27.2px;line-height:34px;margin:0}.errorbox{background:#ffdad6;color:#410002;border-radius:12px;padding:12px;font-size:23.8px;line-height:30px}.errorbox .button{margin-top:10px}
.map{background-image:url('my-points-v1-assets/native-map.png');background-size:360px 780px;background-position:0 -32px}.veil{position:absolute;inset:0;background:#0005;z-index:2}.modal{position:absolute;left:16px;right:16px;top:52px;bottom:70px;z-index:3;background:#fff1eb;border-radius:28px;display:flex;flex-direction:column;padding:24px;gap:16px}.modal h2{font-size:30px;line-height:38px;font-weight:500;margin:0}.modal .scroll{flex:1}.modal .sectionlabel{font-size:20.4px;line-height:26px;color:#6d5b50;letter-spacing:.2px;margin:12px 0 8px}.choices{display:flex;flex-direction:column;gap:4px}.choices .button{font-size:23.8px;line-height:30px;padding:7px 10px;min-height:48px;border-color:#d1bdb0}.textbutton{border:0;background:transparent;color:#8b4f2b;min-height:48px;padding:8px 12px;font-size:23.8px;line-height:30px;align-self:flex-end;flex:none}.modal-footer{display:flex;justify-content:flex-end;flex:none}.sheet{position:absolute;inset:16px 0 0;background:#fff1eb;border-radius:28px 28px 0 0;display:flex;flex-direction:column;padding-top:8px}.handle{width:32px;height:4px;background:#82746d;border-radius:4px;margin:10px auto 18px;flex:none}.sheet .header{padding-top:0}.list{padding:0 0 20px}.pointrow{display:flex;align-items:center;gap:16px;padding:20px 16px;min-height:56px}.pointname{flex:1;border:0;padding:12px 0;background:transparent;text-align:left;font-size:27.2px;line-height:34px;min-height:48px;overflow-wrap:normal}.switch-target{width:52px;min-width:52px;height:52px;background:transparent;border:0;display:flex;align-items:center;padding:0}.switch{display:block;width:52px;height:32px;border:2px solid #82746d;background:#eaddd6;border-radius:20px;position:relative}.switch:after{content:'';position:absolute;top:6px;left:6px;width:16px;height:16px;background:#82746d;border-radius:50%}.switch.on{border-color:#8b4f2b;background:#8b4f2b}.switch.on:after{top:2px;left:22px;width:24px;height:24px;background:#fff0e7}.empty{padding:34px 24px;text-align:center;font-size:27.2px;line-height:34px}.dialog{position:absolute;top:128px;bottom:auto;max-height:540px;left:0;right:0;padding:24px;background:#ffede3;border-radius:28px;z-index:4;display:flex;flex-direction:column;gap:16px}.dialog h2{font-size:30px;line-height:38px;margin:0;font-weight:500}.dialog .message{font-size:27.2px;line-height:34px;max-height:280px;overflow:auto;margin:0}.dialog .stack{align-items:flex-end;flex:none}.dialog .textbutton{padding:8px 12px}.location{position:absolute;bottom:88px;left:16px;right:16px;padding:12px;background:#fff1eb;border-radius:12px;display:flex;align-items:center;gap:8px;z-index:4;font-size:23.8px;line-height:30px}.location span{flex:1}.location .button{width:76px;flex:none;padding-left:12px;padding-right:12px}
</style>
<style>
/* Pure photo crops exclude the reference sheet's embedded delete controls. */
.photo{background-size:1012px 674.67px;background-position:-362px -178px}.photo.alt{background-position:-507px -178px}.photo.third{background-position:-362px -297px}
.hero{background-size:2747px 1831px;background-position:-984px -537px}
/* Existing selection hides idle controls; the map substrate here is illustrative. */
.location-mode{background-size:720px 1560px;background-position:-180px -200px}
.selection-target{position:absolute;left:174px;top:344px;width:12px;height:12px;border-radius:50%;background:#d32f2f;border:2px solid white;box-shadow:0 0 0 1px #d32f2f}
.map-toolbar{position:absolute;bottom:0;left:0;right:0;height:56px;background-image:url('my-points-v1-assets/native-map.png');background-size:360px 780px;background-position:0 -676px}
.map-badges{position:absolute;top:0;left:0;right:0;height:58px;background-image:url('my-points-v1-assets/native-map.png');background-size:360px 780px;background-position:0 -32px}
</style>
<div class="device"><div class="status"></div><main class="app" id="app"></main><div class="nav"></div></div>
<script>
const app=document.getElementById('app');
const titles=['Тропа к лесной поляне','Место перехода через ручей у северного края старой вырубки','Мост через ручей','Стоянка у дороги','Развилка троп'];
const back='<button class="back" aria-label="Назад">←</button>';
const header=(t,subtitle='')=>`<header class="header">${back}<div><h1 class="heading">${t}</h1>${subtitle?'<div class="sub">'+subtitle+'</div>':''}</div></header>`;
const btn=(t,primary=false)=>`<button class="button ${primary?'primary':''}">${t}</button>`;
const photos=(remove=true)=>`<div class="photos" aria-label="Фотографии, горизонтальная прокрутка">${['','alt','third'].map((c,i)=>`<div class="photo ${c}" role="img" aria-label="Фото ${i+1}">${remove?`<button class="remove" aria-label="Удалить фото ${i+1}"><span>×</span></button>`:''}</div>`).join('')}</div>`;
const media=(withPhotos)=>`<h2 class="section">Фотографии</h2><div class="stack">${btn('Сделать фото')}${btn('Выбрать из галереи')}</div>${withPhotos?photos():''}`;
const field=(label,value,cls='')=>`<div class="field ${cls}"><label>${label}</label>${value}</div>`;
const coords=`<h2 class="section">Координаты</h2><div class="coords">56.834120, 60.612345</div>${btn('Изменить место')}`;
const form=(edit=false,withPhotos=false,error='')=>`${header(edit?'Редактирование':'Новая точка',edit?'':'Создание объекта')}<div class="scroll" id="content"><div class="form">${error==='validation'?field('Название','', 'error')+'<div class="hint">Введите название</div>':edit||withPhotos?field('Название',titles[0]):'<div class="field placeholder">Название</div>'}${edit||withPhotos?field('Заметка','Деревянный мостик после поворота тропы.','area'):'<div class="field placeholder area">Заметка</div>'}${coords}<hr class="divider">${media(withPhotos)}${error==='save'?'<div class="errorbox">Не удалось сохранить точку. Изменения остались в форме.</div>':''}<div class="stack">${btn('Отмена')}${btn('Сохранить',true)}</div></div></div>`;
const pointrow=(name,on=false)=>`<div class="pointrow"><button class="switch-target" role="switch" aria-checked="${on}" aria-label="Показывать: ${name}"><i class="switch ${on?'on':''}"></i></button><button class="pointname">${name}</button></div>`;
const list=(empty=false)=>`<div class="sheet"><div class="handle"></div>${header('Мои точки')}<div class="scroll list" id="content">${empty?'<div class="empty">Нет сохранённых точек</div>':titles.map((n,i)=>pointrow(n,i===0||i===2)).join('')}</div></div>`;
const card=(error=false)=>`${header('Моя точка')}<div class="scroll" id="content"><div class="form"><h2 class="section">${titles[0]}</h2><p class="note">Деревянный мостик после поворота тропы. После дождя берег скользкий.</p><button class="hero" aria-label="Открыть фотографию"></button>${photos(false)}<section class="card"><h2 class="section">Координаты</h2><div class="coords">56.834120, 60.612345</div>${btn('Показать на карте')}</section>${error?'<div class="errorbox">Не удалось удалить точку<div class="stack">'+btn('Повторить')+'</div></div>':''}${btn('Редактировать')}${btn('Удалить точку')}</div></div>`;
const section='ИССЛЕДОВАТЕЛЬСКИЕ ОБЪЕКТЫ';
const chooser=()=>`<div class="veil"></div><section class="modal"><h2>Что создать?</h2><div class="scroll" id="content"><div class="sectionlabel">${section}</div><div class="choices">${['Точка наблюдения','Дупло','Колода'].map(t=>btn(t)).join('')}<button class="button" disabled>Ловушка — пока недоступно</button><button class="button" disabled>Пасека — пока недоступно</button></div><hr class="divider"><div class="sectionlabel">ПОЛЬЗОВАТЕЛЬСКИЕ ОБЪЕКТЫ</div><div class="choices">${btn('Моя точка')}</div></div><footer class="modal-footer"><button class="textbutton">Отмена</button></footer></section>`;
const confirm=()=>`<div class="veil"></div><section class="dialog"><h2>Удалить точку?</h2><p class="message">«${titles[0]}» будет удалена из Bee Search вместе с фотографиями. Восстановить её нельзя. Исходные файлы в другой папке телефона не затрагиваются.</p><div class="stack"><button class="textbutton">Отмена</button><button class="textbutton">Удалить</button></div></section>`;
let state=new URLSearchParams(location.search).get('state')||'a-chooser-top';
window.renderState=(s)=>{state=s;app.className='app';
 if(s.startsWith('a-')){app.classList.add('map');app.innerHTML=chooser()}
 else if(s==='b-location'){app.classList.add('map','location-mode');app.innerHTML='<div class="map-badges"></div><div class="map-toolbar"></div><div class="selection-target"></div><div class="location"><span>Подтвердите положение объекта</span>'+btn('OK',true)+'</div>'}
 else if(s.startsWith('c-')){app.innerHTML=form(false,s.includes('photos'));}
 else if(s==='d-list'||s==='d-list-bottom'||s==='d-empty'){app.classList.add('map');app.innerHTML=list(s==='d-empty')}
 else if(s.startsWith('e-card')){app.innerHTML=card()}
 else if(s.startsWith('f-edit')){app.innerHTML=form(true,true)}
 else if(s==='f-delete'||s==='f-delete-scrolled'){app.innerHTML=card()+confirm();if(s==='f-delete-scrolled'){const m=app.querySelector('.message');m.scrollTop=m.scrollHeight}}
 else if(s==='f-delete-error'){app.innerHTML=card(true)}
 else if(s==='save-error'){app.innerHTML=form(true,true,'save')}
 else if(s==='validation-error'){app.innerHTML=form(false,false,'validation')}
 else if(s==='visibility-error'){app.classList.add('map');app.innerHTML=`<div class="sheet"><div class="handle"></div>${header('Мои точки')}<div class="scroll" id="content">${pointrow(titles[0],false)}<div class="errorbox" style="margin:0 16px 12px">Не удалось сохранить видимость${btn('Повторить')}</div>${pointrow(titles[1],true)}${pointrow(titles[2],true)}</div></div>`}
 const el=document.getElementById('content');if(el&&(s.endsWith('-bottom')||s==='f-delete-error'||s==='save-error'))el.scrollTop=el.scrollHeight;
 document.title='Мои точки · APPROVED BY OWNER · '+s;return {state:s,scroll:el?{height:el.clientHeight,total:el.scrollHeight,top:el.scrollTop}:null};};
renderState(state);

if(new URLSearchParams(location.search).has('qa')){
 const states=['a-chooser-top','a-chooser-bottom','b-location','c-create-empty','c-create-empty-bottom','c-create-photos-top','c-create-photos-bottom','d-list','d-list-bottom','d-empty','e-card-top','e-card-bottom','f-edit-top','f-edit-bottom','f-delete','f-delete-error','save-error','validation-error','visibility-error'];
 const results=states.map(s=>{const data=renderState(s);const sc=document.getElementById('content');const controls=[...app.querySelectorAll('button')];return {...data,horizontalOverflow:sc?sc.scrollWidth>sc.clientWidth+1:false,smallTargets:controls.filter(b=>b.offsetWidth<48||b.offsetHeight<48).map(b=>b.textContent),cancelOutsideScroll:s.startsWith('a-')?!sc.contains(app.querySelector('.modal-footer button')):null,bottomActions:controls.slice(-2).map(b=>({text:b.textContent.trim(),top:b.getBoundingClientRect().top,bottom:b.getBoundingClientRect().bottom}))};});
 document.body.innerHTML='<pre id="qa-output"></pre>';document.getElementById('qa-output').textContent=JSON.stringify({artifact:'Static CSS mockups; linear fontScale 1.7 approximation; no Android runtime claim',viewport:[1080,2340],results},null,2);
}

</script></html>
