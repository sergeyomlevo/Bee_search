# .agent/decision-policy.yaml
#
# Decision policy for coding agents working on Bee Search.
#
# This file controls HOW an agent makes decisions when requirements,
# implementation details, or available evidence leave room for choice.
#
# It does NOT define Bee Search product requirements or domain rules.
# Project truth lives in docs/.
#
# AGENTS.md defines repository-wide agent behavior.
# This file refines decision-making under ambiguity.
#
# NOTE ON ENFORCEMENT:
# This file governs agent *intent*. It is read and followed by a model and is
# not, by itself, a technical guarantee. Rules marked "should be backed by
# external enforcement" below are candidates for a git pre-commit hook, a CI
# check, or another independent verification mechanism.
#
# Prefer enforcement of observable outcomes over self-reported compliance.
# For example, a database migration should be verified by migration tests
# rather than trusted merely because an agent reports that it is safe.

version: 3

policy:
  principle: >
    Make routine, reversible, low-impact implementation decisions autonomously.
    Escalate decisions that change product behavior, domain semantics,
    persistent data, accepted architecture, or create difficult-to-reverse
    commitments.

  default_when_uncertain: inspect_before_asking


# ---------------------------------------------------------------------------
# Sources and precedence
# ---------------------------------------------------------------------------

sources:

  project_truth:
    - docs/product-requirements.md
    - docs/user-workflows.md
    - docs/domain-model.md
    - docs/data-model.md
    - docs/architecture.md
    - docs/decisions.md
    - docs/glossary.md

  user_preferences:
    - .agent/preferences.yaml

  preference_evidence:
    - .agent/preference-evidence.md

  operational_context:
    - .agent/handoff.md

  operational_context_rule: >
    Operational context helps resume work but is not a normative source and
    does not participate in decision precedence. If it conflicts with current
    user instructions, project truth, user preferences, or verified repository
    state, follow the applicable authoritative source.


rules:

  - id: project_truth_over_preferences
    description: >
      User preferences guide choices only where project requirements and
      accepted decisions leave more than one valid option.
    action: enforce

  - id: no_requirement_invention
    description: >
      Do not convert assumptions, likely future needs, or implementation
      convenience into product requirements.
    action: enforce

  - id: existing_code_is_not_authority
    description: >
      Existing implementation may be incomplete or wrong. When code conflicts
      with documented project truth, investigate rather than preserving the
      code automatically.
    action: enforce


# ---------------------------------------------------------------------------
# Decision classes
# ---------------------------------------------------------------------------

decision_classes:

  routine:
    action: decide_and_continue
    report: only_if_relevant

    description: >
      Small implementation choices that are local, reversible, and do not
      alter documented behavior or architecture.

    examples:
      - local variable naming
      - private helper extraction
      - straightforward Kotlin idioms
      - formatting
      - small internal refactoring
      - test helper organization
      - Compose component extraction
      - obvious null-safety improvements
      - equivalent implementation details


  low_impact:
    action: decide_and_continue
    report: summarize_afterwards

    description: >
      Decisions with more than one reasonable implementation where the choice
      remains local and inexpensive to reverse.

    examples:
      - internal class organization
      - package placement consistent with architecture
      - choosing between equivalent Kotlin standard-library approaches
      - minor UI implementation details not defined by workflows
      - internal repository method shape
      - local error representation
      - test structure


  significant_reversible:
    action: propose_preferred_option
    approval_required: false
    report: before_implementation

    report_after_implementation_allowed_only_if:
      - >
        a hard tool, environment, or agent-harness limitation makes advance
        reporting genuinely impossible, not merely inconvenient
      - >
        the exception itself is stated in the report and the limiting
        condition is named explicitly

    description: >
      A meaningful choice that affects several files or future implementation
      but remains reasonably reversible and does not change established
      product or domain decisions.

    behavior:
      - inspect existing code and documentation first
      - identify the preferred option
      - briefly state why it is preferred
      - mention an important alternative if one exists
      - continue unless the user requests another direction

    examples:
      - introducing a small reusable abstraction
      - reorganizing a feature package
      - changing an internal API used in several places
      - choosing a local state-management pattern
      - a reversible change whose later removal would require substantial work


  project_decision:
    action: ask_before_implementation
    approval_required: true

    description: >
      A choice that changes or establishes product behavior, domain semantics,
      persistent data meaning, architecture, platform commitments, or another
      durable project-level rule.

    examples:
      - adding a new domain entity
      - changing a domain relationship
      - changing a documented workflow
      - changing persistence semantics
      - choosing the offline map format
      - choosing the map data source
      - changing the meaning of an existing field
      - introducing mandatory network dependence
      - changing the one-active-point assumption
      - changing how repeated observations are represented
      - adopting a major framework or infrastructure dependency
      - changing offline-first guarantees


  destructive:
    # High cost-of-error class.
    #
    # External enforcement should verify observable safety properties wherever
    # practical. For database changes, migration tests against realistic
    # existing schemas/data are preferable to relying solely on an approval
    # marker in an agent report or commit message.

    action: ask_before_implementation
    approval_required: true

    description: >
      A change that may destroy, overwrite, invalidate, corrupt, or make
      existing user data inaccessible.

    examples:
      - destructive Room migration
      - deleting persistent fields containing real observations
      - resetting a production or field database
      - irreversible data transformation
      - deleting user-created files
      - replacing confirmed observations


  accepted_decision_conflict:
    # This class is especially important because the user may intentionally
    # request a change without remembering that an earlier accepted decision
    # established the opposite rule.
    #
    # External checks may flag changes to domain/data/architecture documents
    # that have no corresponding decision update, but such checks should
    # supplement rather than replace this policy.

    action: stop_and_explain
    approval_required: true

    description: >
      The requested implementation conflicts with an ACCEPTED decision in
      docs/decisions.md.

    behavior:
      - identify the conflicting decision
      - explain the practical consequence
      - propose the smallest coherent resolution
      - do not silently work around the decision


# ---------------------------------------------------------------------------
# Reversibility and impact assessment
# ---------------------------------------------------------------------------

assessment:

  principle: >
    Evaluate impact and reversibility as separate dimensions. A change that
    appears small by scope may still require escalation because of data risk,
    architecture commitment, or difficulty of reversal.

  questions:
    - Does this change alter user-visible behavior?
    - Does it alter domain meaning or invariants?
    - Does it change persistent data or its interpretation?
    - Does it contradict an ACCEPTED decision?
    - Does it introduce a new dependency or platform commitment?
    - Does it affect offline-first operation?
    - Could it cause loss or corruption of observations?
    - Would reversing it later require a database migration?
    - Would reversing it later require substantial rewrite?
    - Is the choice intentionally left open in docs/decisions.md?

  escalation:

    if_user_visible_behavior_changes:
      class: project_decision

    if_domain_semantics_change:
      class: project_decision

    if_persistent_meaning_changes:
      class: project_decision

    if_accepted_decision_conflicts:
      class: accepted_decision_conflict

    if_data_loss_possible:
      class: destructive

    if_open_project_decision_must_be_resolved:
      class: project_decision

    if_offline_first_behavior_changes:
      class: project_decision

    if_major_platform_commitment_introduced:
      class: project_decision

    if_reversal_requires_database_migration:
      class: significant_reversible
      note: >
        Escalate further to project_decision if persistent meaning changes,
        or to destructive if existing data may be lost, corrupted, or made
        inaccessible.

    if_reversal_requires_substantial_rewrite:
      class: significant_reversible

  rule_for_multiple_matches: >
    When more than one escalation condition matches, use the class requiring
    the greatest degree of user control. destructive and
    accepted_decision_conflict must never be downgraded by another match.


# ---------------------------------------------------------------------------
# Ambiguity handling
# ---------------------------------------------------------------------------

ambiguity:

  first:
    action: inspect

    inspect:
      - relevant implementation
      - relevant docs
      - docs/decisions.md
      - docs/glossary.md
      - .agent/preferences.yaml

  then:

    if_one_option_clearly_follows_project_rules:
      action: implement

    if_multiple_equivalent_low_impact_options:
      action: choose_using_preferences

    if_missing_information_can_be_discovered_locally:
      action: investigate

    if_choice_establishes_new_project_behavior:
      action: ask

    if_choice_is_expensive_to_reverse:
      action: classify_using_assessment

    if_choice_is_destructive:
      action: ask

  avoid:
    - asking questions that can be answered by inspecting the repository
    - asking the user to choose between technically equivalent trivial options
    - silently inventing missing domain rules
    - treating ambiguity as permission to expand scope
    - using ambiguity as justification for avoiding required escalation


# ---------------------------------------------------------------------------
# Preference use
# ---------------------------------------------------------------------------

preferences:

  source: .agent/preferences.yaml

  evidence_source: .agent/preference-evidence.md

  rule: >
    Preferences are tie-breakers among solutions that already satisfy project
    requirements. They must not override explicit requirements or ACCEPTED
    decisions.

  confidence:

    high:
      action: apply_by_default

    medium:
      action: apply_when_low_risk

    low:
      action: treat_as_hint

  conflict:

    explicit_current_user_instruction:
      action: current_instruction_wins

    project_requirement:
      action: project_requirement_wins

    accepted_decision:
      action: accepted_decision_wins

  evidence_integrity:

    every_preference_requires_evidence_record: true

    required_metadata:
      - evidence_type
      - confirmation
      - scope

    allowed_evidence_types:
      - explicit_statement
      - repeated_direct_choice
      - inferred_pattern
      - cross_context_inference
      - legacy_unverified

    allowed_confirmation_values:
      - not_required
      - confirmed_by_user
      - not_confirmed
      - unknown_legacy

    allowed_scopes:
      - general
      - project_specific
      - task_specific

    high_confidence_rule: >
      A high-confidence preference may apply by default only when its evidence
      record shows an explicit reusable user statement for which confirmation
      is not required, or shows that a non-explicit inference was confirmed by
      the user. Inferred, cross-context, or legacy-unverified evidence must not
      remain high-confidence without such confirmation.

    missing_evidence_rule: >
      A preference without an evidence record must not be high-confidence.
      During migration of legacy preferences, record the gap explicitly rather
      than inventing retrospective evidence.

    scope_rule: >
      Evidence from a project-specific or task-specific choice must not be
      generalized into a broader preference without independent supporting
      evidence or explicit user confirmation.


# ---------------------------------------------------------------------------
# Preference learning
# ---------------------------------------------------------------------------

preference_learning:

  enabled: true

  principle: >
    Repeated user choices may provide evidence for a stable development
    preference, but a single situational choice should not automatically
    become a permanent rule. Explicit statements by the user are stronger
    evidence than preferences inferred indirectly from behavior.

  record_evidence_when:
    - the user explicitly states a general preference
    - the same choice is preferred repeatedly
    - the user rejects an approach for a reusable reason
    - the user explicitly corrects the agent's decision-making style

  do_not_generalize_from:
    - a single task-specific constraint
    - temporary debugging choices
    - emergency workarounds
    - decisions forced by current platform limitations
    - choices already dictated by project requirements


  promotion:

    low_to_medium:
      condition: repeated_supporting_evidence
      action: promote
      notify_user: false

    medium_to_high:

      explicit_user_preference:
        condition: >
          the user explicitly states a reusable preference that is intended
          to guide future decisions
        action: promote
        confirmation_required: false
        notify_user: true

      consistent_repeated_evidence:
        condition: >
          repeated independent evidence strongly suggests a stable preference
          but the user has not explicitly stated it as a general rule
        action: propose_promotion
        confirmation_required: true
        notify_user: true

        proposal_content:
          - the preference inferred
          - the supporting evidence
          - that promotion would cause it to apply by default
          - that the user may confirm, reject, or narrow it

  promotion_rule: >
    A preference inferred solely from behavior must not become high-confidence
    and apply silently by default until the user has confirmed the promotion.
    An explicit reusable user preference may become high-confidence without
    redundant confirmation.


  contradiction:

    explicit_user_correction:
      condition: >
        the user explicitly says that an existing preference is wrong,
        outdated, too broad, or no longer desired
      action: revise_preference
      record_revision: true
      record_in: .agent/preference-evidence.md

    ambiguous_whether_exception_or_change:
      condition: >
        new evidence conflicts with an existing preference but does not clearly
        establish whether this is a one-off exception or a durable change
      action: treat_as_exception_and_flag
      record_in: .agent/preference-evidence.md

    repeated_conflicting_evidence:
      condition: >
        multiple independent choices conflict with an existing preference
        without an explicit statement from the user
      action: lower_confidence_and_flag
      record_in: .agent/preference-evidence.md

    clearly_represents_changed_preference:
      condition: >
        the newer evidence clearly establishes a durable preference change
      action: revise_preference
      record_revision: true
      record_in: .agent/preference-evidence.md

  history_rule: >
    Do not silently rewrite preference history. Preserve contradictory evidence
    and revisions so that future agents can distinguish an old preference from
    a later change.

  legacy_migration:
    rule: >
      Preferences created before the current evidence policy must not be
      assumed to have passed the current promotion process merely because their
      stored confidence is high. Classify their evidence provenance explicitly;
      keep high confidence only when the current high-confidence rule is
      satisfied, otherwise lower confidence until confirmation or stronger
      evidence exists.


# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------

dependencies:

  routine_standard_dependency:
    action: evaluate_and_continue

    conditions:
      - solves a current requirement
      - actively maintained
      - compatible with project architecture
      - does not create a major platform commitment
      - does not undermine offline-first behavior
      - remains reasonably inexpensive to replace

  major_dependency:
    action: classify_as_project_decision

    reason: >
      A major dependency normally creates an architectural or platform
      commitment and therefore belongs to the same approval path as other
      project-level decisions rather than using a separate approval system.

    examples:
      - database framework
      - mapping engine
      - dependency injection framework
      - networking architecture
      - synchronization framework
      - large UI framework

  speculative_dependency:
    action: do_not_add


# ---------------------------------------------------------------------------
# Refactoring
# ---------------------------------------------------------------------------

refactoring:

  local_and_required:
    action: do

  local_and_clearly_improves_requested_change:
    action: do_if_low_risk

  unrelated:
    action: avoid

  large_scale:
    action: classify_as_significant_reversible

  changes_architecture:
    action: classify_as_project_decision


# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------

documentation:

  update_when:
    - product behavior changes
    - workflow changes
    - domain rule changes
    - data model changes
    - architecture changes
    - a project decision is accepted, rejected, or superseded
    - canonical terminology changes

  do_not_update_for:
    - formatting-only changes
    - local refactoring with identical behavior
    - private helper changes
    - implementation details not represented in project documentation

  new_decision:
    rule: >
      When an approved change establishes a durable project-level choice,
      update docs/decisions.md rather than storing the decision only in agent
      files.

  decision_status:
    rule: >
      Preserve the distinction between proposed, accepted, rejected, and
      superseded decisions. Do not treat discussion or implementation history
      as proof that a project decision was accepted.


# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------

scope:

  rule: >
    Implement the smallest coherent change that satisfies the current task.

  avoid:
    - speculative features
    - premature generalization
    - future server code without a current requirement
    - future synchronization code without a current requirement
    - unnecessary domain entities
    - unrelated cleanup

  allowed:
    - small supporting changes required for correctness
    - tests needed to protect changed behavior
    - documentation updates required to keep project truth consistent


# ---------------------------------------------------------------------------
# Verification
# ---------------------------------------------------------------------------

verification:

  principle: >
    Verification effort should be proportional to the risk of the change.
    Prefer verification of observable behavior and preserved invariants over
    trusting an agent's own description of what it changed.

  routine_change:
    - relevant compile or static check when practical

  domain_change:
    - unit tests
    - relevant existing tests

  database_change:
    - Room tests
    - constraint tests
    - migration tests when migrations are required
    - >
      when existing field data matters, verify migration behavior using a
      database representing the previous schema rather than only testing
      creation of a fresh database

  ui_change:
    - compile
    - relevant UI tests when available

  map_location_sensor_change:
    - compile
    - automated tests where meaningful
    - identify what still requires physical-device verification

  never:
    - claim a test passed if it was not run
    - hide failing verification
    - treat emulator sensor behavior as proof of real-device behavior
    - treat creation of a fresh database as proof that an in-place migration works

  reporting_success_requires:
    - naming the specific command, test, or check that was run
    - stating its actual result, not an assumed result
    - distinguishing automated verification from manual verification
    - identifying important verification that could not be performed

  external_enforcement_preference:
    rule: >
      Where practical, external enforcement should verify the property that
      matters rather than merely verify that an agent claimed compliance.

    examples:
      - migration test verifies preserved data instead of only requiring an approval marker
      - CI reruns tests instead of trusting a reported success
      - schema checks detect incompatible changes independently of agent narration


# ---------------------------------------------------------------------------
# Reporting
# ---------------------------------------------------------------------------

reporting:

  routine:
    style: concise

  significant:
    include:
      - what is about to change or what changed
      - why this approach was chosen
      - verification performed
      - remaining uncertainty if any

  decision_required:
    include:
      - decision to be made
      - recommended option
      - main alternative
      - important tradeoff

  preference_promotion:
    include:
      - the preference proposed or now applied by default
      - whether it was explicitly stated or inferred
      - the evidence behind it
      - how to correct, narrow, or reject it if wrong

  preference_conflict:
    include_when_relevant:
      - the existing preference
      - the conflicting evidence
      - whether the conflict is being treated as an exception or possible change

  avoid:
    - lengthy explanations of trivial implementation choices
    - presenting every internal thought process
    - asking for approval after a change that required approval beforehand
    - presenting an inferred preference as if the user explicitly stated it
